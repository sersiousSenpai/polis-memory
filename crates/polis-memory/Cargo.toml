[package]
name = "polis-memory"
version.workspace = true
description = "Polis Memory — the crate integrators add: the Polis handle implementing MemoryApi over the store, retrieval (the answer pack, timeline, map), the autonomous gardener (organize, compaction, observations, the semantic index), bundle export and the markdown mirror. Re-exports polis-core, polis-store, polis-llm and polis-embed."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["memory", "agents", "mcp", "claude", "local-first"]
categories = ["command-line-utilities", "development-tools", "database"]

[features]
default = []
# Apple's on-device embedder (macOS) — Redline turns it on.
apple = ["polis-embed/apple"]
# The `polis` binary (Session E1): init | serve | mcp | hook | capture |
# search | context | grep | tree | stats | verify | doctor | restore | backup.
# NEVER enabled by a host: it pulls clap, the standalone server, the MCP
# transports and their runtime into the graph (the documented feature-
# unification hazard; Redline's `polis_deps_stay_lean` pins it off).
cli = [
    # C1: the HTTP model backends (an API key skips the 5–10 s CLI startup)
    # and the on-device embedder the deterministic filer needs. A host never
    # enables `cli`, so its graph is unchanged (`polis_deps_stay_lean`).
    "polis-llm/anthropic",
    "polis-llm/openai-compat",
    "apple",
    "dep:clap",
    "dep:polis-mcp",
    "polis-mcp/remote",
    "dep:polis-server",
    "polis-server/standalone",
    "dep:axum",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:uuid",
]

# The measurement instruments (docs/bench.md): the results writer, CI's eval
# gate, the real-DB instrument and the canary calibration. Tests only; the
# library carries the corpus, canary and eval modules regardless.
eval = []

[[bin]]
name = "polis"
path = "src/bin/polis.rs"
required-features = ["cli"]

[lints]
workspace = true

[dependencies]
polis-core = { workspace = true }
polis-store = { workspace = true }
polis-llm = { workspace = true }
polis-embed = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Identity (E2, plan §4.5): one Ed25519 key per human; devices and agents are
# derived ids (polis-core), so this is the only crypto crate in the graph and
# it is behind no feature — a bundle's signature must verify everywhere.
# BSD-3-Clause; the seed comes from the OS through `getrandom`.
ed25519-dalek = "3"
getrandom = { version = "0.4", features = ["std"] }
# E3: the `SegmentTransport` trait is async (a transport may be a network); the
# two shipped here (a folder, a git remote) do blocking local I/O inside it.
async-trait = "0.1"
# --- the `cli` feature's deps (all optional) ---
clap = { version = "4", features = ["derive"], optional = true }
polis-mcp = { workspace = true, optional = true }
polis-server = { workspace = true, optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-std"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The benches (docs/bench.md). 0.7, not 0.8: 0.8 wants rustc 1.86 and the
# workspace pins 1.85. Default features off — no plotters/rayon.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "memory"
harness = false
