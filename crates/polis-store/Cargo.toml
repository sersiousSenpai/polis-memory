[package]
name = "polis-store"
version.workspace = true
description = "Polis Memory store: the SQLite schema for the hash-chained lake, the class catalog and the derived lexical layer; attaches to a host connection or opens standalone; cross-process-safe chain append."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["memory", "sqlite", "ledger", "fts5", "agents"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
polis-core = { workspace = true }
# `bundled` so a `cargo install polis-memory` needs no system SQLite, and so
# FTS5 + the trigram tokenizer are present — rusqlite 0.31 has no `fts5`
# feature flag; both arrive with the amalgamation's defaults, and
# `PolisStore::require_capabilities` checks for them at attach rather than
# trusting the build.
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
serde_json = "1"
# E3: the foreign-row and trust types are wire shapes too (the CLI prints them,
# the doctor reports them); `serde` was already in the graph through polis-core.
serde = { version = "1", features = ["derive"] }
# The compaction archive (deflate) and the grep arm's regex verifier — the same
# two crates Redline chose, for the same reasons (`regex-lite`, not `regex`:
# +529 KB measured for a backtracking job over a few hundred candidates).
flate2 = "1"
regex-lite = "0.1"
# Fresh catalog node ids.
uuid = { version = "1", features = ["v4"] }
