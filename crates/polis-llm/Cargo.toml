[package]
name = "polis-llm"
version.workspace = true
description = "Polis Memory model backends: the Agent trait the gardener speaks, with Claude Code CLI and Codex CLI backends, and Anthropic / OpenAI-compatible HTTP backends behind features."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["llm", "agents", "claude", "codex", "memory"]
categories = ["api-bindings"]

[features]
default = []
# Direct API backends. Off by default: the CLI backends need no key and no
# network client, and a host (Redline) that has its own HTTP stack must not
# be handed a second one by feature unification.
anthropic = ["dep:reqwest"]
openai-compat = ["dep:reqwest"]

[lints]
workspace = true

[dependencies]
polis-core = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time"] }
tracing = "0.1"
reqwest = { version = "0.13", features = ["json"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
