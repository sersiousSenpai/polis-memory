# Paid external comparisons are on HOLD (bench/hold.json). Keys never activate a run.
name: bench
on:
  pull_request:
    paths: ['bench/**', 'sdk/**', 'crates/polis-core/src/**', 'crates/polis-server/src/api-v1.schema.json', '.github/workflows/bench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 sdk/schema/generate.py --check
      - run: python3 sdk/schema/types.py --check
      - run: python3 -m unittest discover -s bench/tests -v
      - run: python3 -m unittest discover -s sdk/python/tests -v
      - run: node --test sdk/typescript/test/*.test.mjs
      - name: Keyless pipeline artifacts
        run: |
          python3 bench/baselines/run.py --baseline lexical --stub --split full --out out
          python3 bench/baselines/run.py --baseline raw-history --stub --split full --out out
          python3 -m bench.common.report out > out/table.md
      - uses: actions/upload-artifact@v4
        with:
          name: keyless-evaluation-${{ github.run_id }}
          path: out/
