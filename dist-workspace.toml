[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The `polis` binary lives behind polis-memory's `cli` feature (a host never
# enables it; the installers do).
features = ["cli"]
default-features = false
# GitHub artifact attestations (sigstore) on every release artifact.
github-attestations = true
# The Homebrew tap the formula publishes to. Creating that repository and
# the HOMEBREW_TAP_TOKEN secret are the user's outward steps
# (docs/distribution.md); until then the formula is only attached to the
# release.
tap = "sersiousSenpai/homebrew-tap"
publish-jobs = ["homebrew"]
# The release workflow is dry-runnable: `workflow_dispatch` with tag = a
# version builds everything and publishes nothing.
dispatch-releases = true
